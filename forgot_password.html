<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="img/logo_newvision.png">
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/styles_register.css">
</head>
<body>
    <main class="login-container">
        <section class="hero-section">
            <img src="https://i.pinimg.com/1200x/ae/af/62/aeaf629f706097445899547b26ca3517.jpg" alt="Hình nền" class="hero-bg">
            <img src="img/logo.png" alt="Logo" class="logo">
        </section>

        <section class="form-section">
            <div class="form-wrapper">
                <header class="form-header">
                    <h1>Quên mật khẩu?</h1>
                </header>

                <form class="login-form" id="forgotForm">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope-fill icon-inside"></i>
                            <input type="email" id="email" name="email"
                                placeholder="Nhập Email đã đăng ký" required>
                        </div>
                    </div>

                    <p id="msg" class="form-msg"></p>

                    <button type="submit" class="btn-submit" id="btnGetCode">Gửi liên kết</button>

                    <p class="switch-text">
                        <a href="login.html"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="./JS/app_forgotpass.js"></script>
</body>
</html>
