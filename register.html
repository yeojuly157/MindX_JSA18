<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng ký</title>
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="icon" type="image/png" href="img/logo_newvision.png">
        <link
            href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="./CSS/styles_register.css">
        <link rel="stylesheet" href="./CSS/responsive.css">
    </head>
    <body>
        <main class="login-container">
            <section class="hero-section">
                <img
                    src="https://i.pinimg.com/1200x/ae/af/62/aeaf629f706097445899547b26ca3517.jpg"
                    alt="Hình nền" class="hero-bg">
                <img src="img/logo.png" alt="Logo" class="logo">
            </section>

            <section class="form-section">
                <div class="form-wrapper">
                    <header class="form-header">
                        <h1>Tạo tài khoản mới</h1>
                        <p>Đăng ký để nhận báo giá và quản lý đơn hàng dễ dàng
                            hơn</p>
                    </header>

                    <form class="login-form" id="registerForm">
                        <div class="input-group">
                            <label for="fullname">Họ và tên</label>
                            <div class="input-wrapper">
                                <i class="bi bi-person-fill icon-inside"></i>
                                <input type="text" id="fullname" name="fullname"
                                    placeholder="Nhập họ và tên" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="email">Email</label>
                            <div class="input-wrapper">
                                <i class="bi bi-envelope-fill icon-inside"></i>
                                <input type="email" id="email" name="email"
                                    placeholder="Nhập Email" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="phone">Số điện thoại</label>
                            <div class="input-wrapper">
                                <i class="bi bi-telephone-fill icon-inside"></i>
                                <input type="tel" id="phone" name="phone"
                                    placeholder="Nhập số điện thoại" required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="password">Mật khẩu</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill icon-inside"></i>
                                <input type="password" id="password"
                                    name="password" placeholder="Tạo mật khẩu"
                                    required>
                            </div>
                        </div>

                        <div class="input-group">
                            <label for="confirmPassword">Xác nhận mật
                                khẩu</label>
                            <div class="input-wrapper">
                                <i class="bi bi-lock-fill icon-inside"></i>
                                <input type="password" id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>
                        <p id="msg"></p>
                        <button type="submit" class="btn-submit">Đăng ký</button>
                        <div class="divider"><span>Hoặc</span></div>
                        <button type="button" id="btnGoogle" class="btn-google">
                            <i class="bi bi-google"></i> Đăng ký bằng Google
                        </button>
                    </form>
                </div>
            </section>
        </main>
        <script src="./JS/responsive.js"></script>
        <script type="module" src="./JS/app_register.js"></script>
    </body>

</html>
