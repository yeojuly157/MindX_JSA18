<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./CSS/styles_login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="img/logo_newvision.png">
</head>
<body>
    <main class="login-container">
        <section class="hero-section">
            <img src="https://i.pinimg.com/1200x/ae/af/62/aeaf629f706097445899547b26ca3517.jpg" alt="Hình nền" class="hero-bg">
            <img src="img/logo.png" alt="Logo" class="logo">
        </section>
        <section class="form-section">
            <div class="form-wrapper">
                <header class="form-header">
                    <h1>Chào mừng quay trở lại!</h1>
                    <p>Đăng nhập để theo dõi đơn hàng và quản lý yêu cầu in ấn</p>
                </header>
                <form class="login-form" id="loginForm" method="POST">
                    <div class="input-group">
                        <label for="username">Email</label>
                        <div class="input-wrapper">
                           <i class="bi bi-person-fill icon-inside"></i><input type="email" id="email" name="email" placeholder="Nhập email" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock-fill icon-inside"></i><input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a href="forgot_password.html" class="forgot-password">Quên mật khẩu?</a>
                        <a href="register.html" class="register-link">Đăng ký tài khoản</a>
                    </div>
                    <p id="msg" class="form-msg"></p>
                    <button type="submit" class="btn-submit">Đăng nhập</button>
                    <div class="divider"><span>Hoặc</span></div>
                    <button type="button" id="btnGoogle" class="btn-google">
                        <i class="bi bi-google"></i> Đăng nhập bằng Google
                    </button>
                </form>
            </div>
        </section>
    </main>
    <script type="module" src="./JS/app_login.js"></script>
</body>
</html>
